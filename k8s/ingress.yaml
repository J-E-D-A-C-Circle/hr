apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-validation-ingress
  namespace: hr-validation
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-validation-service
                port:
                  number: 80
