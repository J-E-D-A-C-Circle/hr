apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-mysql-pvc
  namespace: hr-validation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-validation-uploads-pvc
  namespace: hr-validation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
