apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-mysql-app
  namespace: hr-validation
  labels:
    app: hr-mysql-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-mysql-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hr-mysql-app
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: hr-validation-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: hr-validation-config
                  key: DB_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-validation-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-validation-secret
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: hr-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hr-mysql-service
  namespace: hr-validation
spec:
  type: NodePort
  selector:
    app: hr-mysql-app
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306
