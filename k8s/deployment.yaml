apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-validation-app
  namespace: hr-validation
  labels:
    app.kubernetes.io/name: hr-validation-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-validation-app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hr-validation-app
    spec:
      tolerations:
        - key: "node.kubernetes.io/disk-pressure"
          operator: "Exists"
        - key: "node.kubernetes.io/memory-pressure"
          operator: "Exists"
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
      securityContext:
        fsGroup: 1001
      containers:
        - name: hr-validation
          image: hr-validation-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: hr-validation-config
            - secretRef:
                name: hr-validation-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: hr-validation-uploads-pvc
