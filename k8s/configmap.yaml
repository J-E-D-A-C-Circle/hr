apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-validation-config
  namespace: hr-validation
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "hr-mysql-service"
  DB_PORT: "3306"
  DB_USER: "hr_user"
  DB_NAME: "hr_validation_db"
  DATABASE_URL: "mysql://hr_user:hr_password@hr-mysql-service:3306/hr_validation_db"
