services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: tempstaff_db
      MYSQL_ROOT_PASSWORD: hr_root_password 
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3002"
    environment:
      DATABASE_URL: mysql://hr_user:hr_password@db:3306/tempstaff_db
      NODE_ENV: production
      # Generate on the server: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # TempStaff HR portal credentials (change all in production)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hr.admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dvla.gov.gh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Super Admin portal credentials
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-hr.admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@dvla.gov.gh}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin123}
    depends_on:
      - db

volumes:
  mysql_data:
