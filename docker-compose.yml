version: '3.8'

services:
  hr-validation-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_validation_platform
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=3000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-pvc-super-secret-jwt-key-2026-production}
    volumes:
      - hr_validation_db:/app/prisma
      - hr_validation_uploads:/app/uploads
    restart: always

volumes:
  hr_validation_db:
  hr_validation_uploads:
