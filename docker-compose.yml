services:
  recruitment-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drap_recruitment_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:drap_password@db:3306/drap_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: drap_recruitment_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: drap_password
      MYSQL_DATABASE: drap_db
    ports:
      - "3306:3306"
    volumes:
      - recruitment_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: drap_recruitment_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: drap_password
    ports:
      - "8080:80"
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: drap_recruitment_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  recruitment_mysql_data:
    external: true
    name: drap_mysql_data
