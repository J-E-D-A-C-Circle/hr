services:
  tempstaff-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempstaff_hr_app
    restart: always
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=mysql://root:tempstaff_password@db:3306/tempstaff_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tempstaff_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tempstaff_password
      MYSQL_DATABASE: tempstaff_db
    ports:
      - "3308:3306"
    volumes:
      - tempstaff_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tempstaff_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: tempstaff_password
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  tempstaff_mysql_data:
