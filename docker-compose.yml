version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: drap_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: drap_password
      MYSQL_DATABASE: drap_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: drap_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: drap_password
    ports:
      - "8080:80"
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: drap_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

volumes:
  mysql_data:
