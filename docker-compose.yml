version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=@Kuw_35567
      - DB_NAME=dvla_nss_portal
      - DB_PORT=3306
      - JWT_SECRET=dvla_nss_portal_jwt_secret_key_2026
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: dvla_nss_db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "@Kuw_35567"
      MYSQL_DATABASE: dvla_nss_portal
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dvla_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: "@Kuw_35567"
      MYSQL_ROOT_PASSWORD: "@Kuw_35567"
    depends_on:
      - db
    restart: always

volumes:
  mysql_data:
