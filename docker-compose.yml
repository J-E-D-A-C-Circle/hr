services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: dvla_nss_portal
      MYSQL_ROOT_PASSWORD: hr_root_password
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hr_password
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: hr_user
      DB_PASSWORD: hr_password
      DB_NAME: dvla_nss_portal
      DATABASE_URL: mysql://hr_user:hr_password@db:3306/dvla_nss_portal
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-dvla_nss_portal_jwt_secret_key_2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dvla.gov.gh}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      WIGAL_API_KEY: ${WIGAL_API_KEY}
      WIGAL_USERNAME: ${WIGAL_USERNAME}
      WIGAL_PASSWORD: ${WIGAL_PASSWORD}
      WIGAL_SENDER_ID: ${WIGAL_SENDER_ID:-DVLA NSS}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

volumes:
  mysql_data:
  app_uploads:
